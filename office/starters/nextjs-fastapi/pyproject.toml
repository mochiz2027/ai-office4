[project]
name = "api"
version = "0.1.0"
description = "{{name}} 백엔드 (FastAPI)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["api/tests"]
pythonpath = ["api"]

[tool.uv]
package = false
